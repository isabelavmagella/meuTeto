services:
  db: 
    image: postgres:16
    container_name: fintrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: fintrack123
      POSTGRES_DB: fintrack
    ports: 
      - "5433:5432"
    volumes:
      - fintrack-data:/var/lib/postgresql/data

volumes:
  fintrack-data: