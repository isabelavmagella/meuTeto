services:
  db: 
    image: postgres:16
    container_name: meu-teto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meu-teto
      POSTGRES_PASSWORD: meu-teto123
      POSTGRES_DB: meu-teto
    ports: 
      - "5433:5432"
    volumes:
      - meu-teto-data:/var/lib/postgresql/data

volumes:
  meu-teto-data: